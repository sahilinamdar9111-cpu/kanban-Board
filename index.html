<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Kanban Board</h1>

<div class="board">

  <!-- TO DO -->
  <div class="column">
    <h2>To Do</h2>
    <div class="task-list" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    <button onclick="addTask('todo')">+ Add Task</button>
  </div>

  <!-- IN PROGRESS -->
  <div class="column">
    <h2>In Progress</h2>
    <div class="task-list" id="progress" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    <button onclick="addTask('progress')">+ Add Task</button>
  </div>

  <!-- DONE -->
  <div class="column">
    <h2>Done</h2>
    <div class="task-list" id="done" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    <button onclick="addTask('done')">+ Add Task</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
